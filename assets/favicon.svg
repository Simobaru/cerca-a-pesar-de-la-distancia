<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Filtro de sombra y brillo -->
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FF3366" flood-opacity="0.38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Gradiente Corazón Rosado Rubí -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6584"/>
      <stop offset="45%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#D90429"/>
    </linearGradient>

    <!-- Gradiente Brillo Superior -->
    <linearGradient id="glossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Gradiente Corona Dorada -->
    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF394"/>
      <stop offset="40%" stop-color="#FFD13B"/>
      <stop offset="100%" stop-color="#E69500"/>
    </linearGradient>

    <!-- Gradiente Destello Estrella -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFE066"/>
    </linearGradient>
  </defs>

  <!-- Grupo Principal con Sombra -->
  <g filter="url(#favGlow)">
    
    <!-- Corazón Base -->
    <path d="M 64 116 
             C 24 88, 6 62, 6 38 
             C 6 18, 22 4, 42 4 
             C 53 4, 60 10, 64 16 
             C 68 10, 75 4, 86 4 
             C 106 4, 122 18, 122 38 
             C 122 62, 104 88, 64 116 Z" 
          fill="url(#heartGrad)" 
          stroke="#FFFFFF" 
          stroke-width="3.5" 
          stroke-linejoin="round"/>

    <!-- Brillo Glaseado 3D en el lóbulo izquierdo -->
    <path d="M 42 10 
             C 26 10, 14 22, 14 38 
             C 14 52, 24 68, 44 86 
             C 32 70, 24 54, 24 40 
             C 24 26, 32 14, 46 14 
             C 48 14, 50 14.5, 52 15 
             C 48 11.5, 45 10, 42 10 Z" 
          fill="url(#glossGrad)"/>

    <!-- Brillo circular superior -->
    <ellipse cx="38" cy="24" rx="8" ry="4" transform="rotate(-30 38 24)" fill="#FFFFFF" opacity="0.6"/>

    <!-- Coronita Dorada de Princesa (Arriba a la derecha del corazón) -->
    <g transform="translate(62, -2) rotate(14 20 20)">
      <!-- Base de la corona -->
      <path d="M 4 28 L 8 10 L 18 20 L 28 8 L 38 20 L 48 10 L 52 28 Z" 
            fill="url(#goldCrown)" 
            stroke="#FFFFFF" 
            stroke-width="2.5" 
            stroke-linejoin="round"/>
      <path d="M 4 28 C 16 32, 40 32, 52 28 L 50 33 C 38 37, 18 37, 6 33 Z" 
            fill="#CC7A00" 
            stroke="#FFFFFF" 
            stroke-width="1.8"/>
      <!-- Gemas brillantes en las puntas de la corona -->
      <circle cx="8" cy="10" r="3" fill="#FFFFFF" stroke="#FFAE00" stroke-width="1"/>
      <circle cx="28" cy="8" r="3.8" fill="#FF3366" stroke="#FFFFFF" stroke-width="1.2"/>
      <circle cx="48" cy="10" r="3" fill="#FFFFFF" stroke="#FFAE00" stroke-width="1"/>
      <!-- Joyas centrales -->
      <circle cx="28" cy="24" r="2.2" fill="#48CAE4"/>
      <circle cx="18" cy="24" r="1.8" fill="#FF85A2"/>
      <circle cx="38" cy="24" r="1.8" fill="#FF85A2"/>
    </g>

    <!-- Destellos Mágicos / Estrellitas -->
    <!-- Destello Grande Izquierda -->
    <path d="M 16 68 Q 22 68 22 62 Q 22 68 28 68 Q 22 68 22 74 Q 22 68 16 68 Z" 
          fill="url(#sparkleGrad)" 
          stroke="#FFFFFF" 
          stroke-width="0.8"/>
    
    <!-- Destello Pequeño Derecha -->
    <path d="M 108 80 Q 112 80 112 76 Q 112 80 116 80 Q 112 80 112 84 Q 112 80 108 80 Z" 
          fill="url(#sparkleGrad)" 
          stroke="#FFFFFF" 
          stroke-width="0.6"/>

    <!-- Mini corazón flotante adicional -->
    <path d="M 104 22 C 98 16, 92 22, 98 28 L 104 34 L 110 28 C 116 22, 110 16, 104 22 Z" 
          fill="#FFB7C5" 
          stroke="#FFFFFF" 
          stroke-width="1.2" 
          transform="scale(0.8) translate(22, 0)"/>

  </g>
</svg>
