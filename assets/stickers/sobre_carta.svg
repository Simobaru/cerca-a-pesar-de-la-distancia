<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra de Pegatina (Sticker Effect) -->
    <filter id="letter-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#b88390" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>

    <!-- Gradientes de Color -->
    <linearGradient id="envBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F5"/>
      <stop offset="100%" stop-color="#FFD1DC"/>
    </linearGradient>

    <linearGradient id="envFlap" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FFE4EC"/>
      <stop offset="100%" stop-color="#FFCCD9"/>
    </linearGradient>

    <linearGradient id="envFrontL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAEBC"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>

    <linearGradient id="envFrontR" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFAEBC"/>
      <stop offset="100%" stop-color="#FF6B8B"/>
    </linearGradient>

    <linearGradient id="envBottom" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF5376"/>
      <stop offset="100%" stop-color="#FF758F"/>
    </linearGradient>

    <linearGradient id="heartPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8DA1"/>
      <stop offset="100%" stop-color="#FF4071"/>
    </linearGradient>

    <linearGradient id="heartPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2A9FF"/>
      <stop offset="100%" stop-color="#B366FF"/>
    </linearGradient>

    <linearGradient id="heartCoral" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E80"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>

    <linearGradient id="heartGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <linearGradient id="waxSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4071"/>
      <stop offset="50%" stop-color="#D81B60"/>
      <stop offset="100%" stop-color="#AD1457"/>
    </linearGradient>
  </defs>

  <g filter="url(#letter-shadow)">
    <!-- Borde Blanco Grueso de Pegatina / Die-cut Base -->
    <path d="M 120 230 
             C 90 230, 80 260, 80 290 
             L 80 430 
             C 80 455, 105 470, 130 470 
             L 382 470 
             C 407 470, 432 455, 432 430 
             L 432 290 
             C 432 260, 422 230, 392 230 
             C 400 170, 380 90, 340 60 
             C 290 30, 260 70, 240 100 
             C 210 60, 160 70, 140 120 
             C 115 150, 120 200, 120 230 Z" 
          fill="#FFFFFF" 
          stroke="#FFFFFF" 
          stroke-width="26" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- ================= CORAZONES Y MAGIA FLOTANTE ================= -->
    <!-- Rastro de destellos mágicos -->
    <path d="M 210 240 Q 180 180 220 120 T 320 60" 
          stroke="#FFE082" 
          stroke-width="3" 
          stroke-dasharray="4,8" 
          stroke-linecap="round" 
          fill="none" 
          opacity="0.8"/>

    <!-- Corazón Gigante Central Brillante -->
    <g transform="translate(260, 120) scale(1.4)">
      <path d="M 0 -10 
               C 0 -22, -22 -22, -22 -6 
               C -22 8, 0 24, 0 24 
               C 0 24, 22 8, 22 -6 
               C 22 -22, 0 -22, 0 -10 Z" 
            fill="url(#heartPink)"/>
      <!-- Brillo dentro del corazón -->
      <path d="M -12 -12 C -18 -12, -18 -4, -18 -4 C -18 2, -10 10, -6 14" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
      <circle cx="-10" cy="-12" r="3" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Corazón 2: Arriba a la derecha (Lila/Magenta) -->
    <g transform="translate(350, 85) rotate(18) scale(0.95)">
      <path d="M 0 -10 
               C 0 -22, -22 -22, -22 -6 
               C -22 8, 0 24, 0 24 
               C 0 24, 22 8, 22 -6 
               C 22 -22, 0 -22, 0 -10 Z" 
            fill="url(#heartPurple)"/>
      <circle cx="-8" cy="-10" r="2.5" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Corazón 3: Izquierda media (Coral/Rosa Pastel) -->
    <g transform="translate(160, 145) rotate(-22) scale(0.85)">
      <path d="M 0 -10 
               C 0 -22, -22 -22, -22 -6 
               C -22 8, 0 24, 0 24 
               C 0 24, 22 8, 22 -6 
               C 22 -22, 0 -22, 0 -10 Z" 
            fill="url(#heartCoral)"/>
      <circle cx="-7" cy="-9" r="2" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Corazón 4: Pequeño arriba izquierda (Dorado Cálido) -->
    <g transform="translate(180, 80) rotate(-10) scale(0.6)">
      <path d="M 0 -10 
               C 0 -22, -22 -22, -22 -6 
               C -22 8, 0 24, 0 24 
               C 0 24, 22 8, 22 -6 
               C 22 -22, 0 -22, 0 -10 Z" 
            fill="url(#heartGold)"/>
      <circle cx="-6" cy="-8" r="2" fill="#FFFFFF" opacity="0.8"/>
    </g>

    <!-- Corazón 5: Saliendo del sobre -->
    <g transform="translate(295, 205) rotate(12) scale(0.7)">
      <path d="M 0 -10 
               C 0 -22, -22 -22, -22 -6 
               C -22 8, 0 24, 0 24 
               C 0 24, 22 8, 22 -6 
               C 22 -22, 0 -22, 0 -10 Z" 
            fill="url(#heartPink)"/>
    </g>

    <!-- Estrellitas de Brillo / Destellos Kawaii -->
    <path d="M 125 185 Q 125 198 115 198 Q 125 198 125 211 Q 125 198 135 198 Q 125 198 125 185 Z" fill="#FFE082"/>
    <path d="M 390 145 Q 390 158 380 158 Q 390 158 390 171 Q 390 158 400 158 Q 390 158 390 145 Z" fill="#FF8DA1"/>
    <path d="M 305 50 Q 305 60 297 60 Q 305 60 305 70 Q 305 60 313 60 Q 305 60 305 50 Z" fill="#FFE082"/>
    
    <circle cx="215" cy="190" r="4.5" fill="#FFE082"/>
    <circle cx="370" cy="195" r="3.5" fill="#FFB7C5"/>
    <circle cx="140" cy="115" r="3" fill="#B39DDB"/>

    <!-- ================= PARTE INTERIOR / SOLAPA ABIERTA ================= -->
    <!-- Solapa Abierta hacia atrás -->
    <path d="M 106 280 L 256 160 L 406 280 Z" fill="url(#envFlap)" stroke="#FFB6C1" stroke-width="2"/>

    <!-- ================= HOJA DE CARTA QUE SALE ================= -->
    <g id="letter-sheet" transform="translate(136, 185)">
      <!-- Papel de carta blanco con esquinas redondeadas -->
      <rect x="0" y="0" width="240" height="170" rx="10" fill="#FFFFFF" stroke="#F0D0D8" stroke-width="3"/>
      
      <!-- Mini Estampilla postal con borde dentado -->
      <g transform="translate(185, 15)">
        <rect x="0" y="0" width="40" height="48" fill="#FFF0F5" stroke="#FF758F" stroke-width="2" stroke-dasharray="4,2"/>
        <path d="M 20 18 C 20 12, 10 12, 10 20 C 10 26, 20 32, 20 32 C 20 32, 30 26, 30 20 C 30 12, 20 12, 20 18 Z" fill="#FF5277"/>
      </g>

      <!-- Líneas de escritura manuscrita tétrica/dulce -->
      <line x1="25" y1="35" x2="165" y2="35" stroke="#FF8DA1" stroke-width="4" stroke-linecap="round"/>
      <line x1="25" y1="55" x2="175" y2="55" stroke="#FFB7C5" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="75" x2="215" y2="75" stroke="#FFB7C5" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="95" x2="195" y2="95" stroke="#FFB7C5" stroke-width="3" stroke-linecap="round"/>
      <line x1="25" y1="115" x2="150" y2="115" stroke="#FFB7C5" stroke-width="3" stroke-linecap="round"/>

      <!-- Firma / Besito con amor -->
      <path d="M 175 110 C 175 105, 180 102, 186 102 C 192 102, 197 105, 197 110 C 197 118, 186 123, 186 123 C 186 123, 175 118, 175 110 Z" fill="#FF4071"/>
      <text x="25" y="145" font-family="'Caveat', 'Segoe Script', cursive, sans-serif" font-size="18" font-weight="bold" fill="#FF4071">Con todo mi amor...</text>
    </g>

    <!-- ================= CUERPO PRINCIPAL DEL SOBRE ================= -->
    <!-- Fondo del sobre -->
    <rect x="106" y="270" width="300" height="180" rx="16" fill="url(#envBody)"/>

    <!-- Solapas frontales dobladas con sombras -->
    <!-- Solapa Izquierda -->
    <path d="M 106 270 L 256 375 L 106 450 Z" fill="url(#envFrontL)" opacity="0.95"/>

    <!-- Solapa Derecha -->
    <path d="M 406 270 L 256 375 L 406 450 Z" fill="url(#envFrontR)" opacity="0.95"/>

    <!-- Solapa Inferior -->
    <path d="M 106 450 L 256 345 L 406 450 Z" fill="url(#envBottom)"/>

    <!-- Borde decorativo fino del sobre -->
    <rect x="106" y="270" width="300" height="180" rx="16" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>

    <!-- ================= CARITA KAWAII EN EL SOBRE ================= -->
    <!-- Ojo Izquierdo -->
    <ellipse cx="205" cy="405" rx="5" ry="7" fill="#3D1A24"/>
    <circle cx="203" cy="403" r="2" fill="#FFFFFF"/>

    <!-- Ojo Derecho -->
    <ellipse cx="307" cy="405" rx="5" ry="7" fill="#3D1A24"/>
    <circle cx="305" cy="403" r="2" fill="#FFFFFF"/>

    <!-- Boquita feliz -->
    <path d="M 251 405 Q 256 413 261 405" stroke="#3D1A24" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Mejillas sonrojadas -->
    <ellipse cx="188" cy="412" rx="9" ry="5.5" fill="#FF4071" opacity="0.5"/>
    <ellipse cx="324" cy="412" rx="9" ry="5.5" fill="#FF4071" opacity="0.5"/>

    <!-- ================= SELLO DE LACRE DE CORAZÓN EN EL CENTRO ================= -->
    <g id="wax-seal" transform="translate(256, 355)">
      <!-- Lacre irregular -->
      <path d="M -22 0 
               C -24 -12, -12 -24, 0 -22 
               C 14 -24, 24 -10, 22 2 
               C 24 14, 10 24, 0 22 
               C -12 24, -24 12, -22 0 Z" 
            fill="url(#waxSeal)" 
            stroke="#880E4F" 
            stroke-width="1.5"/>
      
      <circle cx="0" cy="0" r="15" fill="#C2185B"/>
      
      <!-- Corazón grabado dentro del sello -->
      <path d="M 0 -5 
               C 0 -11, -9 -11, -9 -3 
               C -9 4, 0 10, 0 10 
               C 0 10, 9 4, 9 -3 
               C 9 -11, 0 -11, 0 -5 Z" 
            fill="#FF8DA1"/>
      
      <!-- Brillo en el lacre -->
      <circle cx="-8" cy="-10" r="3" fill="#FFFFFF" opacity="0.6"/>
    </g>

  </g>
</svg>
